name: Deploy web app to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The official Vercel CLI is used directly. No third party deploy action ever sees the token.
      # VITE_RUST_BACKEND_URL is read from the Vercel project environment variables.
      - run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
      - run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
