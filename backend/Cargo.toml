[package]
name    = "arctos-backend"
version = "0.3.0"
edition = "2021"
description = "Arctos live data service: market, whales, sniper discovery, news, stocks, portfolio, AI proxy"

[lib]
name = "arctos_backend"
path = "src/lib.rs"

[[bin]]
name = "arctos-backend"
path = "src/main.rs"

[dependencies]
axum          = { version = "0.7", features = ["ws", "macros"] }
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tower-http    = { version = "0.5", features = ["cors", "trace", "compression-gzip", "set-header", "timeout", "limit"] }
tower         = "0.4"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
sqlx          = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "chrono"] }
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# One TLS stack everywhere (rustls with ring): no system OpenSSL needed at build or run time.
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
chrono        = { version = "0.4", features = ["serde"] }
dotenv        = "0.15"
thiserror     = "1"
futures-util  = "0.3"
quick-xml     = "0.37"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname", "builder"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
